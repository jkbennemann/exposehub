<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>exposehub inspector</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="bar">
        <a class="brand" href="./" aria-label="exposehub inspector">
            <svg viewBox="0 0 32 16" aria-hidden="true"><path d="M6 8h20" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="5" cy="8" r="4" fill="currentColor"/><circle cx="27" cy="8" r="4" fill="currentColor"/></svg>
            <span>exposehub <em>inspector</em></span>
        </a>
        <ul class="tunnels" id="tunnels" aria-label="Open tunnels"></ul>
        <span class="live" id="live" role="status">connecting</span>
    </header>

    <section class="stats" id="stats" aria-label="Summary of the requests shown"></section>

    <main class="split">
        <section class="list" aria-label="Requests">
            <div class="tools">
                <label class="filter">
                    <span class="visually-hidden">Filter by path, method or status</span>
                    <input id="filter" type="search" placeholder="Filter  /  path, method or status" autocomplete="off" spellcheck="false">
                </label>
                <div class="classes" role="group" aria-label="Show statuses">
                    <button type="button" data-class="2" aria-pressed="true">2xx</button>
                    <button type="button" data-class="3" aria-pressed="true">3xx</button>
                    <button type="button" data-class="4" aria-pressed="true">4xx</button>
                    <button type="button" data-class="5" aria-pressed="true">5xx</button>
                </div>
                <button type="button" class="quiet" id="clear">Clear</button>
            </div>
            <ol class="rows" id="rows" tabindex="0" aria-label="Requests, newest first"></ol>
            <div class="empty" id="empty" hidden></div>
        </section>

        <section class="detail" id="detail" aria-live="polite">
            <div class="placeholder">Select a request to see what was sent and what came back.</div>
        </section>
    </main>
</body>
</html>
