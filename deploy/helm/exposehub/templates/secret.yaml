{{- if not .Values.secrets.existingSecret }}
{{- $nodeSecret := required "secrets.nodeSecret is required (openssl rand -hex 32), or set secrets.existingSecret" .Values.secrets.nodeSecret }}
{{- if lt (len $nodeSecret) 32 }}
{{- fail "secrets.nodeSecret must be at least 32 characters (openssl rand -hex 32)" }}
{{- end }}
{{- $appKey := required "secrets.appKey is required (echo \"base64:$(openssl rand -base64 32)\"), or set secrets.existingSecret" .Values.secrets.appKey }}
{{- if not (hasPrefix "base64:" $appKey) }}
{{- fail "secrets.appKey must start with base64: (echo \"base64:$(openssl rand -base64 32)\")" }}
{{- end }}
# What the tunnel server needs, and nothing more.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eh.serverName" . }}
  labels:
    {{- include "eh.labels" . | nindent 4 }}
type: Opaque
stringData:
  EXPOSEHUB_NODE_SECRET: {{ $nodeSecret | quote }}
  {{- with .Values.secrets.staticTokens }}
  EXPOSEHUB_STATIC_TOKENS: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eh.webName" . }}
  labels:
    {{- include "eh.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ $appKey | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required (openssl rand -hex 24), or set secrets.existingSecret" .Values.secrets.dbPassword | quote }}
  EXPOSEHUB_NODE_SECRET: {{ $nodeSecret | quote }}
  {{- with .Values.secrets.mailPassword }}
  MAIL_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
