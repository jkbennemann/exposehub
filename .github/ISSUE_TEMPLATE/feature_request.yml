name: Feature request
description: Something exposehub should do that it does not do yet.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Three things before you start:

        - Look through the [open requests](https://github.com/jkbennemann/exposehub/issues?q=is%3Aissue+is%3Aopen+label%3Aenhancement+sort%3Areactions-%2B1-desc) first. If yours is there, a 👍 on it and a comment with your situation help more than a second issue.
        - One request per issue. Two ideas are two issues.
        - A security problem does not belong here. Report it privately as SECURITY.md describes.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where exposehub gets in the way today. One concrete situation says more than a general wish.
      placeholder: "When I share a tunnel with a client, I have to ... because ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: How it could work, if you have an idea. A command, a screen or a setting as you imagine it. Leave it empty if you only know the problem.
  - type: dropdown
    id: part
    attributes:
      label: Which part it concerns
      options:
        - The agent (the exposehub command)
        - The tunnel server
        - The dashboard
        - Installing and running a server (Compose, Helm)
        - The documentation
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: use
    attributes:
      label: How you use exposehub
      description: It tells us whom a feature is for.
      options:
        - I run a server for myself
        - I run a server for a team or a company
        - I use a server someone else runs
        - I am trying it out
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: A workaround, another tool, or nothing at all.
  - type: checkboxes
    id: help
    attributes:
      label: Taking part
      description: Optional. Nobody is held to it.
      options:
        - label: I could test an early version of this.
        - label: I could work on it myself, once the approach is agreed.
