version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/tunnel"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      go:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/tunnel"
      - "/web"
      - "/deploy/caddy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      docker:
        patterns:
          - "*"
